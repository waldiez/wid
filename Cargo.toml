[package]
name = "waldiez-wid"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "WID — time-ordered, human-readable, collision-resistant identifier"
repository = "https://github.com/waldiez/wid"
homepage = "https://waldiez.github.io/wid"
readme = "README.md"
keywords = ["identifier", "id", "time-ordered", "hlc", "distributed"]
categories = ["data-structures", "date-and-time", "command-line-utilities"]
# The repo is polyglot; without this allowlist `cargo publish` would ship the
# C/Go/Python/TS/sh trees, committed JS dist/, and docs into the crate tarball.
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/rust/src/**",
    "/spec/SPEC.md",
    "/spec/CRYPTO_SPEC.md",
]

[lib]
name = "wid"
path = "rust/src/lib.rs"

[[bin]]
name = "wid"
path = "rust/src/main.rs"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
hex = "0.4.3"
thiserror = "2.0.18"
regex = "1.12.4"
ed25519-dalek = { version = "2.2.0", features = ["pem", "pkcs8"] }
hmac = "0.12.1"
base64 = "0.22.1"
subtle = "2.6.1"
rusqlite = { version = "0.37.0", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[dev-dependencies]
futures = "0.3.32"
