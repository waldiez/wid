---
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Gate 1: the pushed tag must match every package manifest. Publishing six
  # registries from a tag that disagrees with the manifests ships a version
  # that does not exist in the source tree.
  check-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Tag matches Cargo.toml / package.json / pyproject.toml
        run: |
          set -eu
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag_ver="${GITHUB_REF_NAME#v}"
          else
            # workflow_dispatch: still enforce that the manifests agree with
            # each other, using the Cargo.toml version as the reference.
            tag_ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          fi
          cargo_ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          npm_ver="$(python3 -c 'import json;print(json.load(open("package.json"))["version"])')"
          py_ver="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n1)"
          echo "tag=$tag_ver cargo=$cargo_ver npm=$npm_ver py=$py_ver"
          [ "$tag_ver" = "$cargo_ver" ] && [ "$tag_ver" = "$npm_ver" ] && [ "$tag_ver" = "$py_ver" ] || {
            echo "::error::version mismatch between tag and package manifests"; exit 1; }

  # Gate 2: the full per-language test battery plus cross-language
  # conformance. A tag push must never publish code that CI would fail.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable snapshot 2026-07
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22"
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: "1.25"
          cache: false
      - run: python3 -m pip install -e ".[dev,crypto,sql]"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: make rust-check
      - run: make python-check
      - run: make ts-check
      - run: make go-check
      - run: make c-check
      - run: make c-sanitize
      - run: make sh-check
      # Cross-language gates, mirroring ci.yml: a tag must never publish code
      # that a main-branch CI run would fail.
      - run: ID_CONFORMANCE_STRICT=1 make id-conformance
      - run: make stream-conformance
      - run: CLI_SURFACE_STRICT=1 make cli-surface-check
      - run: WOTP_PARITY_STRICT=1 WOTP_PYTHON=python3 WOTP_PARITY_LANGS=sh,python,typescript,go,rust,c make wotp-parity-check
      - run: SMOKE_CRYPTO_STRICT=1 bash tools/smoke_crypto.sh

  publish-pypi:
    needs: [check-versions, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/waldiez-wid
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1

  publish-npm:
    needs: [check-versions, test]
    runs-on: ubuntu-latest
    # id-token lets npm attach a build provenance attestation linking the
    # published tarball to this repo+workflow run (PyPI gets the equivalent
    # via OIDC trusted publishing).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: npm run build
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-crates:
    needs: [check-versions, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable snapshot 2026-07
      - run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-docker:
    needs: [check-versions, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: |
            ghcr.io/waldiez/wid
            docker.io/waldiez/wid
            quay.io/waldiez/wid
          # `latest` comes from metadata-action's default `latest=auto`
          # flavor, which applies it only to non-prerelease semver tags — a
          # v1.1.0-rc.1 tag must not hijack `latest`.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
