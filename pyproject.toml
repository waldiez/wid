[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "waldiez-wid"
version = "1.0.0"
requires-python = ">=3.10"
license = "MIT"
description = "WID — time-ordered, human-readable, collision-resistant identifier"
readme = "README.md"

[project.urls]
Repository = "https://github.com/waldiez/wid"
Homepage = "https://waldiez.github.io/wid"
"Bug Tracker" = "https://github.com/waldiez/wid/issues"

[project.scripts]
wid = "wid.cli:main"
hlc-wid = "wid.cli:hlc_wid_main"

[project.optional-dependencies]
crypto = [
    "cryptography",
]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
    "coverage",
    "prek",
]
bench = [
    "nanoid",
    "ulid-py",
    "ksuid",
]
sql = [
    "aiosqlite",
]

[tool.hatch.build.targets.wheel]
packages = ["python/wid"]

[tool.hatch.build.targets.sdist]
packages = ["python/wid"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["F", "Q", "D", "I", "G", "C4", "C90", "E", "W", "B", "N", "A"]
# Allow fix for all enabled rules (when `--fix`) is provided.
ignore = ["D203", "D211", "D212", "D213"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# W and Z (and their capitalized locals) are spec vocabulary — sequence
# width and pad length — shared verbatim across all six implementations.
"python/wid/*" = ["N803", "N806"]
# Test names are the documentation; no docstring requirement in tests.
"python/tests/*" = ["D101", "D102", "D103"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["aiosqlite"]
ignore_missing_imports = true

[tool.basedpyright]
extraPaths = ["python"]
reportCallIssue = false
reportUnusedCallResult = false
reportExplicitAny = false
reportUnannotatedClassAttribute = false
reportAny = false
reportImplicitOverride = false

[tool.pytest.ini_options]
testpaths = ["python/tests"]
